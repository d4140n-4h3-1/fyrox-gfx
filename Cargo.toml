[package]
name = "fyrox-gfx"
version = "0.1.0"
edition = "2021"
description = "Graphics improvements for Fyrox that live outside the engine: refractive glass, and more to come."
license = "MIT"

# Not part of any game's workspace on purpose: a game picks the engine backend, and this crate
# follows whatever it picked.
[workspace]

[dependencies]
# On the branch with scene-keyed TakenOverMeshes until it is merged into `vulkan`; then back to `vulkan`.
# No default features: the game using this crate decides between OpenGL and wgpu (Vulkan). The
# engine needs exactly one of them, so built on its own the crate needs one named too:
# `cargo check --features fyrox/backend_wgpu` (or `raytracing`, which turns wgpu on), or
# `--features fyrox/backend_opengl`. A plain `cargo check` stops in fyrox with "unresolved import
# `fyrox_impl`"; `cargo test` and the examples pick wgpu through the dev-dependencies below.
fyrox = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "ccr-248d522f-ryd4xx", default-features = false }

# Ray tracing lives in the wgpu backend, because that is where the device and the acceleration
# structures are. Games on OpenGL simply do not enable this feature.
fyrox-graphics-wgpu = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "ccr-248d522f-ryd4xx", optional = true }
# Yoctite's clusters and levels of detail, for the cluster view.
yoctite = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "ccr-248d522f-ryd4xx", optional = true }

[features]
raytracing = ["dep:fyrox-graphics-wgpu", "dep:yoctite", "fyrox/backend_wgpu"]

[dev-dependencies]
fyrox = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "ccr-248d522f-ryd4xx", default-features = false, features = ["backend_wgpu"] }
fyrox-graphics-wgpu = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "ccr-248d522f-ryd4xx" }
# Only to check that the crate's wgpu shaders are valid WGSL (tests/wgsl_shaders.rs), with the
# naga that wgpu compiles them with.
naga = { version = "30", features = ["wgsl-in"] }

[[example]]
name = "glass"
required-features = []
