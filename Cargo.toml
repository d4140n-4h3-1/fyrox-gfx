[package]
name = "fyrox-gfx"
version = "0.1.0"
edition = "2021"
description = "Graphics improvements for Fyrox that live outside the engine: refractive glass, and more to come."
license = "MIT"

# Not part of any game's workspace on purpose: a game picks the engine backend, and this crate
# follows whatever it picked.
[workspace]

[dependencies]
# The wind offsets of meshes that bend are kept as half floats (Yoctite, traced shadows).
half = "2.2.1"
# No default features: the game using this crate decides between OpenGL and wgpu (Vulkan).
fyrox = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "vulkan", default-features = false }

# Ray tracing lives in the wgpu backend, because that is where the device and the acceleration
# structures are. Games on OpenGL simply do not enable this feature.
fyrox-graphics-wgpu = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "vulkan", optional = true }
# Yoctite's clusters and levels of detail, for the cluster view.
yoctite = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "vulkan", optional = true }
# The engine's own wgpu, to ask the card what it can do before Yoctite and Candelite start.
wgpu = { version = "30.0.0", optional = true }

[features]
raytracing = ["dep:fyrox-graphics-wgpu", "dep:yoctite", "dep:wgpu", "fyrox/backend_wgpu"]

[dev-dependencies]
fyrox = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "vulkan", default-features = false, features = ["backend_wgpu"] }
fyrox-graphics-wgpu = { git = "https://github.com/d4140n-4h3-1/Hydroxus.git", branch = "vulkan" }

[[example]]
name = "glass"
required-features = []
